name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android-App (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.7.1 einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Gradle-Wrapper generieren
        run: gradle wrapper --gradle-version 9.7.1

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: putzplan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
