name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Signierte Release-APK bauen und veröffentlichen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gradle-Wrapper generieren
        run: gradle wrapper --gradle-version 8.7

      - name: Version aus Tag extrahieren
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Signierte Release-APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: APK umbenennen
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "putzplan-v${{ steps.version.outputs.version }}.apk"

      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Putzplan ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "putzplan-v${{ steps.version.outputs.version }}.apk"
